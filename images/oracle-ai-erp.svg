<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">AI and Oracle ERP dashboard illustration</title>
  <desc id="desc">A technology-style illustration showing an ERP dashboard, artificial intelligence nodes, charts, and business data cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071a3d"/>
      <stop offset="48%" stop-color="#1747b8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1400" height="620" fill="url(#bg)"/>
  <circle cx="1210" cy="120" r="190" fill="#67e8f9" opacity="0.18"/>
  <circle cx="160" cy="520" r="230" fill="#93c5fd" opacity="0.12"/>

  <g stroke="#bfdbfe" stroke-width="3" opacity="0.55">
    <path d="M190 150 C330 80, 420 210, 560 140 S800 70, 940 160 S1150 250, 1260 140" fill="none"/>
    <path d="M240 470 C400 390, 510 510, 660 420 S920 310, 1140 420" fill="none"/>
  </g>

  <g fill="#e0f2fe" opacity="0.9">
    <circle cx="190" cy="150" r="8"/>
    <circle cx="560" cy="140" r="8"/>
    <circle cx="940" cy="160" r="8"/>
    <circle cx="1260" cy="140" r="8"/>
    <circle cx="240" cy="470" r="8"/>
    <circle cx="660" cy="420" r="8"/>
    <circle cx="1140" cy="420" r="8"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="115" y="105" width="760" height="420" rx="28" fill="url(#panel)"/>
    <rect x="145" y="140" width="700" height="68" rx="18" fill="#0f172a"/>
    <text x="180" y="184" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#ffffff">ERP Intelligence Console</text>
    <rect x="610" y="158" width="190" height="28" rx="14" fill="#2563eb"/>
    <text x="635" y="178" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#dbeafe">AI SIGNALS ACTIVE</text>

    <rect x="150" y="240" width="200" height="120" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="176" y="282" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Invoices</text>
    <text x="176" y="323" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#2563eb">92%</text>
    <text x="176" y="346" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">auto-matched</text>

    <rect x="380" y="240" width="200" height="120" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="406" y="282" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Forecast</text>
    <path d="M405 330 L440 304 L472 318 L512 282 L555 292" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="610" y="240" width="200" height="120" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="636" y="282" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Risk</text>
    <text x="636" y="323" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#f97316">14</text>
    <text x="696" y="318" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">items need</text>
    <text x="696" y="338" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">review</text>

    <rect x="150" y="390" width="660" height="88" rx="18" fill="#dbeafe"/>
    <text x="180" y="426" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">AI recommendation</text>
    <text x="180" y="455" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155">Prioritize supplier exceptions before month-end close.</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="1055" cy="310" r="125" fill="#0f172a"/>
    <circle cx="1055" cy="310" r="88" fill="none" stroke="#38bdf8" stroke-width="12" opacity="0.9"/>
    <circle cx="1055" cy="310" r="46" fill="#2563eb"/>
    <text x="1018" y="322" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#ffffff">AI</text>
    <g stroke="#93c5fd" stroke-width="4">
      <line x1="930" y1="310" x2="835" y2="310"/>
      <line x1="990" y1="205" x2="930" y2="145"/>
      <line x1="1120" y1="205" x2="1185" y2="145"/>
      <line x1="1125" y1="415" x2="1195" y2="480"/>
      <line x1="985" y1="418" x2="925" y2="482"/>
    </g>
    <g fill="#e0f2fe">
      <circle cx="835" cy="310" r="14"/>
      <circle cx="930" cy="145" r="14"/>
      <circle cx="1185" cy="145" r="14"/>
      <circle cx="1195" cy="480" r="14"/>
      <circle cx="925" cy="482" r="14"/>
    </g>
  </g>
</svg>
